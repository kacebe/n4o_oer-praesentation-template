name: Validate OER metadata

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-amb:
    name: Validate AMB metadata
    runs-on: ubuntu-24.04

    steps:

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.11.9"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyter
          python -m pip install -r _qa/requirements.txt
          python -m pip check

      - name: Check software versions
        run: |
          quarto --version
          python --version

      - name: Run quality assurance tests
        run: |
          python -m unittest discover \
            -s _qa/scripts \
            -p 'test_*.py' \
            -v

      - name: Render Quarto project
        run: |
          quarto render

      - name: Validate AMB metadata
        run: |
          python _qa/scripts/validate_metadata.py \
            _site/index.html \
            _site/template.html \
            --report _qa/reports/validation.json

      - name: Upload validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: amb-validation-report
          path: _qa/reports/validation.json
          retention-days: 30
          if-no-files-found: warn
